<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>语音转写与翻译</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <svg class="svg-defs" aria-hidden="true"><defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H5v18h14V8zM14 3v5h5M8 12h8m-8 4h6"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M4 14v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="12" width="4" height="8" rx="2"/><rect x="17" y="12" width="4" height="8" rx="2"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M5 16v4h14v-4"/></symbol>
  </defs></svg>
  <aside class="sidebar">
    <div class="sidebar-heading"><button id="workspace-link" class="workspace-link">记录</button><button id="new-meeting" class="button small" aria-label="新建记录"><svg><use href="#i-plus"/></svg>新建</button></div>
    <div class="history-header"><span>历史记录</span><span id="history-count">0</span></div>
    <nav id="history" class="history" aria-label="历史记录"><p class="history-empty">暂无记录</p></nav>
    <button id="settings-button" class="settings-button"><svg><use href="#i-settings"/></svg>模型设置</button>
  </aside>
  <main>
    <header class="topbar"><h1>语音转写与翻译</h1><div class="topbar-right"><span id="connection" class="connection">正在连接</span><span id="mode-badge" class="mode-badge">连接中</span><button id="export-button" class="button secondary" disabled><svg><use href="#i-download"/></svg>导出</button></div></header>
    <div class="page">
      <section class="session-bar">
        <div class="session-title"><h2 id="meeting-title">未选择记录</h2><div class="session-meta"><span id="meeting-date">新建记录或开始录音</span><span class="meta-dot">·</span><span id="language-label">中文 → English</span></div></div>
        <div class="session-actions"><span id="session-status" class="status-pill">未开始</span><button id="finish-button" class="button secondary" disabled>结束记录</button></div>
      </section>
      <section class="workspace-grid">
        <article class="panel transcript-panel">
          <div class="panel-heading"><h2>原文与译文</h2><div class="panel-tools"><button id="search-button" class="icon-button" aria-label="搜索原文"><svg><use href="#i-search"/></svg></button><label class="auto-scroll"><input id="auto-scroll" type="checkbox" checked>自动滚动</label></div></div>
          <div class="transcript-toolbar"><div class="tabs"><button id="bilingual-tab" class="tab active">双语</button><button id="original-tab" class="tab">原文</button></div><div class="transcript-actions"><button id="retranslate-button" class="text-button" disabled>重新翻译</button><span id="segment-count">0 条原文</span></div></div>
          <div id="search-wrap" class="search-wrap" hidden><input id="transcript-search" placeholder="搜索" aria-label="搜索原文或译文"></div>
          <div id="transcript" class="transcript" aria-live="polite"><div class="empty-state"><p>暂无转写</p><button id="empty-demo" class="text-button">播放示例</button></div></div>
          <form id="text-form" class="text-composer"><label for="text-input" class="sr-only">输入原文</label><input id="text-input" placeholder="输入原文" maxlength="2000" autocomplete="off"><button type="submit" aria-label="发送原文"><svg><use href="#i-arrow"/></svg></button></form>
        </article>
        <article class="panel notes-panel">
          <div class="panel-heading"><h2>纪要</h2><button id="summary-button" class="button small" disabled>生成纪要</button></div>
          <div class="notes-description"><span id="summary-rule">每 4 句自动生成</span><span id="summary-status">等待原文</span></div>
          <div id="notes" class="notes" aria-live="polite"><div class="notes-empty"><p>暂无纪要</p></div></div>
          <div class="notes-footer"><span>点击编号查看原文</span></div>
        </article>
      </section>
      <section class="recording-dock">
        <div class="recording-info"><span id="recording-icon" class="recording-indicator"></span><div><strong id="recording-title">未录音</strong><span id="recording-description"></span></div></div>
        <div class="audio-meter"><canvas id="waveform" width="220" height="44" aria-label="麦克风音量"></canvas><span id="timer">00:00</span></div>
        <div class="recording-actions"><button id="upload-button" class="button secondary" aria-label="导入 WAV 录音" title="导入 WAV" disabled><svg><use href="#i-upload"/></svg>导入音频</button><button id="demo-button" class="button secondary"><svg><use href="#i-play"/></svg><span>播放示例</span></button><button id="mic-button" class="button primary" disabled><svg><use href="#i-mic"/></svg><span>开始录音</span></button></div>
        <input id="audio-file" type="file" accept=".wav,audio/wav" hidden>
      </section>
      <section class="metrics-row"><div><span id="runtime-label">本地运行</span></div><div>字数 <strong id="word-count">0</strong></div><div>翻译耗时 <strong id="latency">—</strong></div><div>排队 <strong id="queue-count">0</strong></div><div>纪要 <strong id="summary-count">0</strong></div></section>
      <div id="mode-description" class="mode-description"></div>
    </div>
  </main>
  <dialog id="new-dialog"><form id="new-form"><div class="dialog-heading"><h2>新建记录</h2><button type="button" class="icon-button close-dialog" aria-label="关闭"><svg><use href="#i-close"/></svg></button></div><label>名称<input name="title" id="new-title" placeholder="记录名称" maxlength="100" required></label><div class="form-row"><label>原文语言<select name="source"><option value="zh">中文</option><option value="en">English</option><option value="auto">自动识别</option></select></label><label>目标语言<select name="target"><option value="en">English</option><option value="zh">简体中文</option></select></label></div><label>术语<textarea name="glossary" rows="3" maxlength="2000" placeholder="例如 ROCm, Qwen, AMD, GPU">ROCm, Qwen, AMD, GPU</textarea></label><div class="dialog-foot"><button class="button primary" type="submit">创建</button></div></form></dialog>
  <dialog id="export-dialog"><div class="dialog-heading"><h2>导出记录</h2><button class="icon-button close-dialog" aria-label="关闭"><svg><use href="#i-close"/></svg></button></div><div class="export-options"><button data-export="md"><strong>Markdown <span>.md</span></strong><small>原文、译文和纪要</small></button><button data-export="json"><strong>JSON <span>.json</span></strong><small>完整记录及耗时</small></button><button data-export="srt"><strong>双语字幕 <span>.srt</span></strong><small>按音频片段的时间范围导出</small></button></div></dialog>
  <dialog id="settings-dialog"><div class="dialog-heading"><h2>模型设置</h2><button class="icon-button close-dialog" aria-label="关闭"><svg><use href="#i-close"/></svg></button></div><div id="runtime-details" class="runtime-details"></div></dialog>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script src="static/app.js" defer></script>
</body>
</html>
